<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap');
      text { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
      .code { font-family: 'JetBrains Mono', 'Consolas', monospace; }
    </style>
    <linearGradient id="bgGrad4c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#08080F"/>
      <stop offset="100%" stop-color="#0D0D18"/>
    </linearGradient>
    <linearGradient id="codeAccent4c" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#39FF14"/>
    </linearGradient>
    <linearGradient id="purpleAccent4c" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9B59B6"/>
      <stop offset="100%" stop-color="#FF007F"/>
    </linearGradient>
    <filter id="shadow4c">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00E676" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad4c)"/>
  <rect x="0" y="0" width="6" height="675" fill="url(#codeAccent4c)"/>

  <!-- Code background lines -->
  <g opacity="0.05" class="code">
    <text x="40" y="50" font-size="10" fill="#39FF14">1  &gt; npx create-solfoundry-app</text>
    <text x="40" y="68" font-size="10" fill="#39FF14">2  &gt; ✓ Project created</text>
    <text x="40" y="86" font-size="10" fill="#39FF14">3  &gt; cd bounty-app</text>
    <text x="40" y="104" font-size="10" fill="#39FF14">4  &gt; npm run dev</text>
    <text x="40" y="122" font-size="10" fill="#39FF14">5  &gt; 🚀 Server running</text>
    <text x="40" y="140" font-size="10" fill="#39FF14">6  &gt; Ready for deployment</text>
  </g>

  <!-- Logo -->
  <g transform="translate(50, 50)">
    <rect x="0" y="12" width="36" height="6" rx="2" fill="url(#codeAccent4c)"/>
    <polygon points="7,18 29,18 25,38 11,38" fill="#00E676" opacity="0.9"/>
    <rect x="14" y="38" width="8" height="10" rx="1" fill="#9B59B6"/>
    <text x="48" y="32" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="1">SolFoundry</text>
  </g>

  <!-- Code tag badge -->
  <g transform="translate(50, 110)">
    <rect x="0" y="-14" width="130" height="28" rx="14" fill="#0D0D18" stroke="#00E676" stroke-width="1.5"/>
    <text x="65" y="5" font-size="12" font-weight="700" fill="#00E676" text-anchor="middle" letter-spacing="2" class="code">&lt;BOUNTY /&gt;</text>
  </g>

  <!-- Bounty Title (EDITABLE) -->
  <text x="50" y="220" font-size="38" font-weight="800" fill="#FFFFFF" class="editable-title">[BOUNTY TITLE]</text>

  <!-- Tagline -->
  <text x="50" y="270" font-size="18" font-weight="600" fill="#39FF14" class="code">// SHIP CODE. EARN FNDRY.</text>

  <text x="50" y="310" font-size="16" font-weight="400" fill="#8899AA">Build decentralized applications</text>
  <text x="50" y="335" font-size="16" font-weight="400" fill="#8899AA">and earn rewards in $FNDRY</text>

  <!-- Reward (EDITABLE) -->
  <g transform="translate(50, 420)">
    <text font-size="52" font-weight="900" fill="#FFFFFF" class="editable-reward" filter="url(#shadow4c)">[AMOUNT]</text>
    <text x="0" y="48" font-size="20" font-weight="700" fill="url(#codeAccent4c)" letter-spacing="2">$FNDRY</text>
  </g>

  <!-- Difficulty -->
  <g transform="translate(50, 530)">
    <rect x="0" y="-18" width="130" height="36" rx="18" fill="#0D0D18" stroke="#9B59B6" stroke-width="1.5"/>
    <text x="65" y="6" font-size="14" font-weight="600" fill="#CCCCDD" text-anchor="middle">[DIFFICULTY]</text>
  </g>

  <!-- CTA -->
  <g transform="translate(220, 530)">
    <rect x="0" y="-22" width="200" height="44" rx="22" fill="url(#purpleAccent4c)"/>
    <text x="100" y="7" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1" class="code">START BUILDING</text>
  </g>

  <!-- Footer -->
  <text x="50" y="640" font-size="12" font-weight="400" fill="#445566" letter-spacing="1">solfoundry.io / #BuildOnSolFoundry</text>

  <!-- Right side code block decor -->
  <g transform="translate(950, 220)" opacity="0.08" class="code">
    <text x="0" y="0" font-size="11" fill="#9B59B6">if let Some(bounty) =</text>
    <text x="0" y="20" font-size="11" fill="#9B59B6">    registry.get(id) {</text>
    <text x="0" y="40" font-size="11" fill="#9B59B6">    let reward = bounty</text>
    <text x="0" y="60" font-size="11" fill="#9B59B6">        .calculate(contribution);</text>
    <text x="0" y="80" font-size="11" fill="#9B59B6">    wallet.credit(reward);</text>
    <text x="0" y="100" font-size="11" fill="#9B59B6">}</text>
  </g>
</svg>
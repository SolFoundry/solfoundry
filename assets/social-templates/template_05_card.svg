<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
      text { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    </style>
    <linearGradient id="bgGrad5c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050510"/>
      <stop offset="100%" stop-color="#0A0A20"/>
    </linearGradient>
    <linearGradient id="rocketGrad5c" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="30%" stop-color="#39FF14"/>
      <stop offset="70%" stop-color="#9B59B6"/>
      <stop offset="100%" stop-color="#FF007F"/>
    </linearGradient>
    <linearGradient id="launchAccent5c" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9B59B6"/>
      <stop offset="50%" stop-color="#FF007F"/>
      <stop offset="100%" stop-color="#00E676"/>
    </linearGradient>
    <radialGradient id="starGlow5c" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#9B59B6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#9B59B6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow5c">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow5c">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#9B59B6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad5c)"/>
  <circle cx="600" cy="337" r="350" fill="url(#starGlow5c)"/>
  <rect x="0" y="0" width="6" height="675" fill="url(#rocketGrad5c)"/>

  <!-- Stars -->
  <g fill="#FFFFFF" opacity="0.25">
    <circle cx="150" cy="80" r="1.5"/><circle cx="300" cy="50" r="1"/>
    <circle cx="900" cy="70" r="2"/><circle cx="1050" cy="200" r="1.5"/>
    <circle cx="80" cy="350" r="1"/><circle cx="1140" cy="450" r="1.5"/>
    <circle cx="200" cy="550" r="1"/><circle cx="1000" cy="580" r="0.8"/>
    <circle cx="700" cy="40" r="0.8"/><circle cx="450" cy="620" r="1.2"/>
  </g>

  <!-- Logo -->
  <g transform="translate(50, 40)">
    <rect x="0" y="12" width="36" height="6" rx="2" fill="url(#rocketGrad5c)"/>
    <polygon points="7,18 29,18 25,38 11,38" fill="#00E676" opacity="0.9"/>
    <rect x="14" y="38" width="8" height="10" rx="1" fill="#9B59B6"/>
    <text x="48" y="32" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="1">SolFoundry</text>
  </g>

  <!-- Small rocket icon -->
  <g transform="translate(50, 95)">
    <ellipse cx="15" cy="-5" rx="6" ry="12" fill="none" stroke="url(#rocketGrad5c)" stroke-width="1.5" filter="url(#glow5c)"/>
    <polygon points="10,10 15,25 20,10" fill="#FF007F" opacity="0.6"/>
    <rect x="50" y="-14" width="140" height="28" rx="14" fill="none" stroke="#9B59B6" stroke-width="1.5"/>
    <text x="120" y="5" font-size="13" font-weight="700" fill="#9B59B6" text-anchor="middle" letter-spacing="3" filter="url(#glow5c)">NEW BOUNTY</text>
  </g>

  <!-- Bounty Title (EDITABLE) -->
  <text x="50" y="210" font-size="40" font-weight="800" fill="#FFFFFF" class="editable-title">[BOUNTY TITLE]</text>

  <text x="50" y="260" font-size="18" font-weight="400" fill="#8899AA">Fresh bounty just launched in the</text>
  <text x="50" y="290" font-size="18" font-weight="600" fill="#9B59B6">SolFoundry ecosystem</text>

  <!-- Reward (EDITABLE) -->
  <g transform="translate(50, 400)">
    <text font-size="58" font-weight="900" fill="#FFFFFF" class="editable-reward" filter="url(#shadow5c)">[AMOUNT]</text>
    <text x="0" y="55" font-size="22" font-weight="700" fill="url(#launchAccent5c)" letter-spacing="3">$FNDRY REWARD</text>
  </g>

  <!-- Difficulty & CTA -->
  <g transform="translate(50, 530)">
    <rect x="0" y="-20" width="140" height="40" rx="20" fill="#0A0A20" stroke="#FF007F" stroke-width="1.5"/>
    <text x="70" y="6" font-size="14" font-weight="600" fill="#CCCCDD" text-anchor="middle">[DIFFICULTY]</text>
  </g>

  <g transform="translate(240, 530)">
    <rect x="0" y="-22" width="200" height="44" rx="22" fill="url(#launchAccent5c)"/>
    <rect x="0" y="-22" width="200" height="44" rx="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1"/>
    <text x="100" y="6" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">LAUNCH →</text>
  </g>

  <!-- Footer -->
  <text x="50" y="640" font-size="12" font-weight="400" fill="#445566" letter-spacing="1">solfoundry.io / #BuildOnSolFoundry</text>
</svg>
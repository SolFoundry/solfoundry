<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
      text { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    </style>
    <linearGradient id="bgGrad3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A12"/>
      <stop offset="100%" stop-color="#0F0F1A"/>
    </linearGradient>
    <linearGradient id="coinGrad3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="50%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <linearGradient id="rewardAccent3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
    <radialGradient id="coinGlowGrad3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
    <filter id="coinGlow3">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow3">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#00E676" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bgGrad3)"/>
  <circle cx="540" cy="540" r="400" fill="url(#coinGlowGrad3)"/>

  <!-- Decorative coin particles -->
  <g opacity="0.06">
    <circle cx="200" cy="150" r="12" fill="#FFD700"/>
    <circle cx="850" cy="200" r="16" fill="#FFD700"/>
    <circle cx="150" cy="850" r="10" fill="#00E676"/>
    <circle cx="900" cy="800" r="14" fill="#00E676"/>
    <circle cx="350" cy="950" r="8" fill="#FFD700"/>
    <circle cx="750" cy="120" r="9" fill="#FFD700"/>
  </g>

  <!-- Corner accents -->
  <rect x="40" y="40" width="60" height="3" rx="1.5" fill="#00E676" opacity="0.5"/>
  <rect x="40" y="40" width="3" height="60" rx="1.5" fill="#00E676" opacity="0.5"/>

  <!-- Logo -->
  <g transform="translate(80, 80)">
    <rect x="0" y="20" width="50" height="8" rx="2" fill="url(#coinGrad3)"/>
    <polygon points="10,28 40,28 35,55 15,55" fill="#00E676" opacity="0.9"/>
    <rect x="20" y="55" width="10" height="15" rx="1" fill="#9B59B6"/>
    <text x="65" y="42" font-size="26" font-weight="700" fill="#FFFFFF" letter-spacing="1">SolFoundry</text>
  </g>

  <!-- Large Coin / Token visual -->
  <g transform="translate(540, 300)">
    <circle cx="0" cy="0" r="90" fill="#1A1A2E" stroke="#00E676" stroke-width="3"/>
    <circle cx="0" cy="0" r="85" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.4"/>
    <circle cx="0" cy="0" r="75" fill="none" stroke="#FFD700" stroke-width="0.5" opacity="0.2" stroke-dasharray="4,4"/>

    <!-- Dollar sign -->
    <text x="0" y="15" font-size="60" font-weight="900" fill="url(#coinGrad3)" text-anchor="middle" filter="url(#coinGlow3)">$</text>
    <text x="0" y="55" font-size="14" font-weight="700" fill="#8899AA" text-anchor="middle" letter-spacing="2">FNDRY</text>
  </g>

  <!-- Badge -->
  <g transform="translate(540, 440)">
    <rect x="-70" y="-16" width="140" height="32" rx="16" fill="none" stroke="#FFD700" stroke-width="1.5" opacity="0.8"/>
    <text x="0" y="5" font-size="13" font-weight="700" fill="#FFD700" text-anchor="middle" letter-spacing="3">REWARD</text>
  </g>

  <!-- Bounty Title (EDITABLE) -->
  <text x="540" y="520" font-size="40" font-weight="800" fill="#FFFFFF" text-anchor="middle" class="editable-title">[BOUNTY TITLE]</text>
  <text x="540" y="560" font-size="18" font-weight="400" fill="#8899AA" text-anchor="middle">Complete and earn $FNDRY tokens</text>

  <!-- Huge Reward Amount (EDITABLE) -->
  <text x="540" y="680" font-size="90" font-weight="900" fill="#FFFFFF" text-anchor="middle" class="editable-reward" filter="url(#shadow3)">[AMOUNT]</text>
  <text x="540" y="760" font-size="34" font-weight="700" fill="url(#rewardAccent3)" text-anchor="middle" letter-spacing="3">$FNDRY REWARD</text>

  <!-- Difficulty -->
  <g transform="translate(540, 860)">
    <rect x="-100" y="-22" width="200" height="44" rx="22" fill="#1A1A2E" stroke="#9B59B6" stroke-width="1.5"/>
    <text x="0" y="6" font-size="15" font-weight="600" fill="#CCCCDD" text-anchor="middle">[DIFFICULTY]</text>
  </g>

  <!-- CTA -->
  <g transform="translate(540, 960)">
    <rect x="-130" y="-27" width="260" height="54" rx="27" fill="url(#coinGrad3)"/>
    <text x="0" y="7" font-size="20" font-weight="800" fill="#0A0A12" text-anchor="middle" letter-spacing="1">EARN FNDRY</text>
  </g>
</svg>
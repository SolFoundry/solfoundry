<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
      text { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    </style>
    <linearGradient id="bgGrad1c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0F"/>
      <stop offset="100%" stop-color="#12121A"/>
    </linearGradient>
    <linearGradient id="accentGrad1c" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#9B59B6"/>
    </linearGradient>
    <filter id="shadow1c">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00E676" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad1c)"/>

  <!-- Decorative side accent -->
  <rect x="0" y="0" width="6" height="675" fill="url(#accentGrad1c)"/>

  <!-- Grid pattern -->
  <g stroke="#1A1A2E" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="135" x2="1200" y2="135"/><line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/><line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="240" y1="0" x2="240" y2="675"/><line x1="480" y1="0" x2="480" y2="675"/>
    <line x1="720" y1="0" x2="720" y2="675"/><line x1="960" y1="0" x2="960" y2="675"/>
  </g>

  <!-- Logo placeholder -->
  <g transform="translate(50, 40)">
    <rect x="0" y="12" width="36" height="6" rx="2" fill="url(#accentGrad1c)"/>
    <polygon points="7,18 29,18 25,38 11,38" fill="#00E676" opacity="0.9"/>
    <rect x="14" y="38" width="8" height="10" rx="1" fill="#9B59B6"/>
    <text x="48" y="32" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="1">SolFoundry</text>
  </g>

  <!-- Badge -->
  <g transform="translate(50, 100)">
    <rect x="0" y="-14" width="100" height="28" rx="14" fill="none" stroke="#00E676" stroke-width="1.5"/>
    <text x="50" y="4" font-size="12" font-weight="700" fill="#00E676" text-anchor="middle" letter-spacing="2">BOUNTY</text>
  </g>

  <!-- Bounty Title (EDITABLE) -->
  <text x="50" y="200" font-size="38" font-weight="800" fill="#FFFFFF" class="editable-title">[BOUNTY TITLE]</text>
  <text x="50" y="250" font-size="20" font-weight="400" fill="#8899AA">Build, earn, and make an impact in the</text>
  <text x="50" y="280" font-size="20" font-weight="600" fill="#9B59B6">SolFoundry ecosystem</text>

  <!-- Reward Section -->
  <g transform="translate(50, 380)">
    <text font-size="52" font-weight="900" fill="#FFFFFF" class="editable-reward" filter="url(#shadow1c)">[AMOUNT]</text>
    <text x="0" y="55" font-size="22" font-weight="700" fill="#00E676" letter-spacing="2">$FNDRY</text>
  </g>

  <!-- Difficulty & CTA side by side -->
  <g transform="translate(50, 530)">
    <rect x="0" y="-20" width="140" height="40" rx="20" fill="#1A1A2E" stroke="#9B59B6" stroke-width="1.5"/>
    <text x="70" y="6" font-size="14" font-weight="600" fill="#CCCCDD" text-anchor="middle">[DIFFICULTY]</text>
  </g>

  <g transform="translate(240, 530)">
    <rect x="0" y="-22" width="180" height="44" rx="22" fill="#00E676"/>
    <text x="90" y="6" font-size="17" font-weight="700" fill="#0A0A0F" text-anchor="middle" letter-spacing="1">APPLY NOW</text>
  </g>

  <!-- Footer -->
  <text x="50" y="630" font-size="12" font-weight="400" fill="#445566" letter-spacing="1">solfoundry.io / #BuildOnSolFoundry</text>

  <!-- Right decorative accent -->
  <g transform="translate(1100, 120)" opacity="0.08">
    <polygon points="0,-80 35,-30 0,20 -35,-30" fill="#00E676"/>
    <polygon points="0,20 35,70 0,120 -35,70" fill="#9B59B6"/>
    <polygon points="80,10 115,60 80,110 45,60" fill="#00E676"/>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
      text { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    </style>
    <linearGradient id="bgGrad2c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0505"/>
      <stop offset="50%" stop-color="#1A0808"/>
      <stop offset="100%" stop-color="#0A0A0F"/>
    </linearGradient>
    <linearGradient id="alertGrad2c" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF1744"/>
      <stop offset="50%" stop-color="#FF5252"/>
      <stop offset="100%" stop-color="#FF007F"/>
    </linearGradient>
    <filter id="shadow2c">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FF1744" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad2c)"/>
  <rect x="0" y="0" width="6" height="675" fill="url(#alertGrad2c)"/>

  <!-- Warning pattern -->
  <g stroke="#FF1744" stroke-width="0.6" opacity="0.06">
    <line x1="0" y1="0" x2="100" y2="100"/><line x1="60" y1="0" x2="160" y2="100"/>
    <line x1="0" y1="575" x2="100" y2="675"/><line x1="60" y1="575" x2="160" y2="675"/>
  </g>

  <!-- Logo -->
  <g transform="translate(50, 40)">
    <rect x="0" y="12" width="36" height="6" rx="2" fill="url(#alertGrad2c)"/>
    <polygon points="7,18 29,18 25,38 11,38" fill="#FF5252" opacity="0.9"/>
    <rect x="14" y="38" width="8" height="10" rx="1" fill="#9B59B6"/>
    <text x="48" y="32" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="1">SolFoundry</text>
  </g>

  <!-- HOT BOUNTY badge -->
  <g transform="translate(50, 110)">
    <rect x="0" y="-15" width="140" height="30" rx="15" fill="none" stroke="#FF1744" stroke-width="1.5"/>
    <text x="70" y="5" font-size="14" font-weight="800" fill="#FF1744" text-anchor="middle" letter-spacing="3" filter="url(#shadow2c)">HOT BOUNTY</text>
  </g>

  <!-- Bounty Title (EDITABLE) -->
  <text x="50" y="210" font-size="40" font-weight="800" fill="#FFFFFF" class="editable-title">[BOUNTY TITLE]</text>
  <text x="50" y="260" font-size="18" font-weight="400" fill="#CC8888">Limited slots — act fast!</text>

  <!-- Deadline Countdown -->
  <g transform="translate(50, 340)">
    <text font-size="14" font-weight="600" fill="#8899AA" letter-spacing="3">DEADLINE</text>
    <rect x="0" y="20" width="320" height="60" rx="10" fill="#1A0808" stroke="#FF1744" stroke-width="1.5" opacity="0.8"/>
    <text x="60" y="56" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle" class="editable-deadline">[DAYS]</text>
    <text x="60" y="73" font-size="11" fill="#FF5252" text-anchor="middle">Days</text>
    <text x="115" y="56" font-size="24" font-weight="700" fill="#FF5252" text-anchor="middle">:</text>
    <text x="145" y="56" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle" class="editable-deadline">[HRS]</text>
    <text x="145" y="73" font-size="11" fill="#FF5252" text-anchor="middle">Hrs</text>
    <text x="185" y="56" font-size="24" font-weight="700" fill="#FF5252" text-anchor="middle">:</text>
    <text x="215" y="56" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle" class="editable-deadline">[MIN]</text>
    <text x="215" y="73" font-size="11" fill="#FF5252" text-anchor="middle">Min</text>
  </g>

  <!-- Reward -->
  <g transform="translate(50, 470)">
    <text font-size="48" font-weight="900" fill="#FFFFFF" class="editable-reward" filter="url(#shadow2c)">[AMOUNT]</text>
    <text x="0" y="50" font-size="20" font-weight="700" fill="#FF007F" letter-spacing="2">$FNDRY REWARD</text>
  </g>

  <!-- Side elements -->
  <g transform="translate(340, 470)">
    <rect x="0" y="-20" width="130" height="40" rx="20" fill="#1A0808" stroke="#FF007F" stroke-width="1.5"/>
    <text x="65" y="6" font-size="14" font-weight="600" fill="#CCCCDD" text-anchor="middle">[DIFFICULTY]</text>
  </g>

  <g transform="translate(500, 470)">
    <rect x="0" y="-22" width="180" height="44" rx="22" fill="url(#alertGrad2c)"/>
    <text x="90" y="6" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">CLAIM BOUNTY →</text>
  </g>

  <!-- Footer -->
  <text x="50" y="630" font-size="12" font-weight="400" fill="#445566" letter-spacing="1">solfoundry.io / #BuildOnSolFoundry</text>

  <!-- Urgent decoration right -->
  <g transform="translate(1100, 160)" opacity="0.08">
    <polygon points="0,-50 30,0 0,50 -30,0" fill="#FF1744"/>
    <polygon points="0,50 30,100 0,150 -30,100" fill="#FF007F"/>
  </g>
</svg>
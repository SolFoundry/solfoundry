<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
      text { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    </style>
    <linearGradient id="bgGrad1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0A0F"/>
      <stop offset="100%" stop-color="#12121A"/>
    </linearGradient>
    <linearGradient id="accentGrad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#9B59B6"/>
    </linearGradient>
    <linearGradient id="glowGrad1" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#00E676" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00E676" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow1">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00E676" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bgGrad1)"/>
  <rect width="1080" height="400" fill="url(#glowGrad1)" opacity="0.5"/>

  <!-- Grid pattern background -->
  <g stroke="#1A1A2E" stroke-width="0.5" opacity="0.4">
    <line x1="0" y1="200" x2="1080" y2="200"/><line x1="0" y1="400" x2="1080" y2="400"/>
    <line x1="0" y1="600" x2="1080" y2="600"/><line x1="0" y1="800" x2="1080" y2="800"/>
    <line x1="216" y1="0" x2="216" y2="1080"/><line x1="432" y1="0" x2="432" y2="1080"/>
    <line x1="648" y1="0" x2="648" y2="1080"/><line x1="864" y1="0" x2="864" y2="1080"/>
  </g>

  <!-- Decorative corner accents -->
  <rect x="40" y="40" width="60" height="3" rx="1.5" fill="#00E676" opacity="0.6"/>
  <rect x="40" y="40" width="3" height="60" rx="1.5" fill="#00E676" opacity="0.6"/>
  <rect x="1040" y="40" width="3" height="60" rx="1.5" fill="#00E676" opacity="0.6"/>
  <rect x="980" y="40" width="60" height="3" rx="1.5" fill="#00E676" opacity="0.6"/>

  <!-- SolFoundry Logo placeholder -->
  <g transform="translate(80, 80)">
    <!-- Anvil shape logo -->
    <rect x="0" y="20" width="50" height="8" rx="2" fill="url(#accentGrad1)"/>
    <polygon points="10,28 40,28 35,55 15,55" fill="#00E676" opacity="0.9"/>
    <rect x="20" y="55" width="10" height="15" rx="1" fill="#9B59B6"/>
    <text x="65" y="42" font-size="26" font-weight="700" fill="#FFFFFF" letter-spacing="1">SolFoundry</text>
  </g>

  <!-- Badge: BOUNTY -->
  <g transform="translate(540, 240)">
    <rect x="-80" y="-18" width="160" height="36" rx="18" fill="none" stroke="#00E676" stroke-width="1.5" opacity="0.8"/>
    <text x="0" y="6" font-size="14" font-weight="700" fill="#00E676" text-anchor="middle" letter-spacing="3" filter="url(#glow1)">BOUNTY</text>
  </g>

  <!-- Bounty Title (EDITABLE) -->
  <text x="540" y="360" font-size="44" font-weight="800" fill="#FFFFFF" text-anchor="middle" class="editable-title">[BOUNTY TITLE]</text>
  <text x="540" y="360" font-size="44" font-weight="800" fill="#00E676" text-anchor="middle" opacity="0.15" transform="translate(3,3)">[BOUNTY TITLE]</text>

  <text x="540" y="420" font-size="22" font-weight="400" fill="#8899AA" text-anchor="middle">Complete the bounty and earn rewards in</text>
  <text x="540" y="455" font-size="22" font-weight="600" fill="#9B59B6" text-anchor="middle">SolFoundry ecosystem</text>

  <!-- Divider -->
  <line x1="390" y1="510" x2="690" y2="510" stroke="url(#accentGrad1)" stroke-width="2" opacity="0.5"/>

  <!-- Reward Amount (EDITABLE) -->
  <text x="540" y="600" font-size="70" font-weight="900" fill="#FFFFFF" text-anchor="middle" class="editable-reward" filter="url(#shadow1)">[AMOUNT]</text>
  <text x="540" y="670" font-size="28" font-weight="700" fill="#00E676" text-anchor="middle" letter-spacing="2">$FNDRY</text>

  <!-- Difficulty Badge (EDITABLE) -->
  <g transform="translate(540, 770)">
    <rect x="-100" y="-24" width="200" height="48" rx="24" fill="#1A1A2E" stroke="#9B59B6" stroke-width="1.5"/>
    <circle cx="-70" cy="0" r="6" fill="#00E676"/>
    <circle cx="-45" cy="0" r="6" fill="#9B59B6" opacity="0.4"/>
    <circle cx="-20" cy="0" r="6" fill="#9B59B6" opacity="0.4"/>
    <text x="15" y="7" font-size="16" font-weight="600" fill="#CCCCDD" text-anchor="start">[DIFFICULTY]</text>
  </g>

  <!-- CTA -->
  <g transform="translate(540, 900)">
    <rect x="-120" y="-27" width="240" height="54" rx="27" fill="#00E676"/>
    <rect x="-120" y="-27" width="240" height="54" rx="27" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1"/>
    <text x="0" y="7" font-size="20" font-weight="700" fill="#0A0A0F" text-anchor="middle" letter-spacing="1">APPLY NOW</text>
  </g>

  <!-- Footer -->
  <text x="540" y="1020" font-size="13" font-weight="400" fill="#445566" text-anchor="middle" letter-spacing="1">solfoundry.io / #BuildOnSolFoundry</text>

  <!-- Diamond decoration -->
  <g transform="translate(540, 1060)" opacity="0.3">
    <polygon points="0,-6 5,0 0,6 -5,0" fill="#00E676"/>
  </g>
</svg>
<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#14F195"/>
    </linearGradient>
    <linearGradient id="g-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B59B6"/>
      <stop offset="100%" stop-color="#9945FF"/>
    </linearGradient>
    <linearGradient id="g-magenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007F"/>
      <stop offset="100%" stop-color="#E91E63"/>
    </linearGradient>
    <linearGradient id="g-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    <linearGradient id="g-deep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0F"/>
      <stop offset="100%" stop-color="#1A1A2E"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="60" fill="url(#g-deep)" stroke="url(#g-gold)" stroke-width="2" opacity="0.95"/>

  <!-- Diamond / gem as "diamond hands" -->
  <g transform="translate(256, 230)" filter="url(#glow)">
    <polygon points="0,-90 70,0 0,90 -70,0" fill="none" stroke="url(#g-emerald)" stroke-width="6" stroke-linejoin="round"/>
    <polygon points="0,-90 70,0 0,90" fill="url(#g-emerald)" opacity="0.3"/>
    <polygon points="0,-90 -70,0 0,90" fill="url(#g-purple)" opacity="0.3"/>
    <!-- Inner facets -->
    <line x1="0" y1="-90" x2="0" y2="90" stroke="url(#g-gold)" stroke-width="2" opacity="0.5"/>
    <line x1="-70" y1="0" x2="70" y2="0" stroke="url(#g-gold)" stroke-width="2" opacity="0.5"/>
    <!-- Glow center -->
    <circle cx="0" cy="0" r="15" fill="url(#g-gold)" opacity="0.4"/>
  </g>

  <!-- Hands gripping -->
  <g transform="translate(256, 230)" opacity="0.8">
    <!-- Left hand -->
    <path d="M-90 20 Q-110 0 -100 -15 Q-90 -5 -80 -5 L-70 10" fill="none" stroke="url(#g-purple)" stroke-width="8" stroke-linecap="round"/>
    <path d="M-100 -15 Q-95 -30 -80 -25" fill="none" stroke="url(#g-purple)" stroke-width="6" stroke-linecap="round"/>
    <!-- Right hand -->
    <path d="M90 20 Q110 0 100 -15 Q90 -5 80 -5 L70 10" fill="none" stroke="url(#g-purple)" stroke-width="8" stroke-linecap="round"/>
    <path d="M100 -15 Q95 -30 80 -25" fill="none" stroke="url(#g-purple)" stroke-width="6" stroke-linecap="round"/>
  </g>

  <text x="256" y="400" text-anchor="middle" font-family="'Courier New', monospace" font-size="38" font-weight="bold" fill="url(#g-gold)">DIAMOND</text>
  <text x="256" y="442" text-anchor="middle" font-family="'Courier New', monospace" font-size="38" font-weight="bold" fill="url(#g-emerald)">HANDS</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#14F195"/>
    </linearGradient>
    <linearGradient id="g-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B59B6"/>
      <stop offset="100%" stop-color="#9945FF"/>
    </linearGradient>
    <linearGradient id="g-magenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007F"/>
      <stop offset="100%" stop-color="#E91E63"/>
    </linearGradient>
    <linearGradient id="g-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    <linearGradient id="g-deep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0F"/>
      <stop offset="100%" stop-color="#1A1A2E"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="60" fill="url(#g-deep)" stroke="url(#g-emerald)" stroke-width="2" opacity="0.95"/>

  <!-- Developer keyboard -->
  <g transform="translate(256, 200)">
    <!-- Code brackets -->
    <text x="-80" y="30" font-family="'Courier New', monospace" font-size="80" font-weight="bold" fill="url(#g-emerald)" filter="url(#glow)">&lt;</text>
    <text x="40" y="30" font-family="'Courier New', monospace" font-size="80" font-weight="bold" fill="url(#g-magenta)" filter="url(#glow)">/&gt;</text>
    <!-- Slash -->
    <line x1="-30" y1="-20" x2="30" y2="-20" stroke="url(#g-purple)" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Code lines -->
  <g font-family="'Courier New', monospace" font-size="14" fill="url(#g-purple)" opacity="0.7">
    <text x="160" y="260">forge("FNDRY", {</text>
    <text x="180" y="280">  supply: 1_000_000_000,</text>
    <text x="180" y="300">  forged: true</text>
    <text x="160" y="320">}).then(() =&gt; {</text>
    <text x="180" y="340">  console.log("minted 🚀");</text>
    <text x="160" y="360">});</text>
  </g>

  <!-- Blinking cursor -->
  <rect x="390" y="345" width="12" height="18" rx="2" fill="url(#g-emerald)" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1s" repeatCount="indefinite"/>
  </rect>

  <text x="256" y="440" text-anchor="middle" font-family="'Courier New', monospace" font-size="30" font-weight="bold" fill="url(#g-magenta)" filter="url(#glow)">WAGMI dev</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#14F195"/>
    </linearGradient>
    <linearGradient id="g-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B59B6"/>
      <stop offset="100%" stop-color="#9945FF"/>
    </linearGradient>
    <linearGradient id="g-magenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007F"/>
      <stop offset="100%" stop-color="#E91E63"/>
    </linearGradient>
    <linearGradient id="g-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    <linearGradient id="g-deep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0F"/>
      <stop offset="100%" stop-color="#1A1A2E"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="60" fill="url(#g-deep)" stroke="url(#g-gold)" stroke-width="2" opacity="0.95"/>

  <!-- Double arrow pointing up (to the moon style) + chart line -->
  <g transform="translate(256, 210)" filter="url(#glow)">
    <!-- Chart line up and right -->
    <polyline points="-100,60 -60,40 -20,45 20,10 60,5 100,-30" fill="none" stroke="url(#g-emerald)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Green arrowhead -->
    <polygon points="100,-30 80,-18 85,-35" fill="url(#g-emerald)"/>
  </g>

  <!-- Bar chart -->
  <g opacity="0.6">
    <rect x="140" y="340" width="30" height="80" rx="4" fill="url(#g-purple)"/>
    <rect x="190" y="300" width="30" height="120" rx="4" fill="url(#g-magenta)"/>
    <rect x="240" y="250" width="30" height="170" rx="4" fill="url(#g-gold)"/>
    <rect x="290" y="200" width="30" height="220" rx="4" fill="url(#g-emerald)"/>
    <rect x="340" y="160" width="30" height="260" rx="4" fill="url(#g-purple)"/>
  </g>

  <text x="256" y="440" text-anchor="middle" font-family="'Courier New', monospace" font-size="40" font-weight="bold" fill="url(#g-emerald)">PUMPING</text>
</svg>

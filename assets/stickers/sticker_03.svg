<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#14F195"/>
    </linearGradient>
    <linearGradient id="g-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B59B6"/>
      <stop offset="100%" stop-color="#9945FF"/>
    </linearGradient>
    <linearGradient id="g-magenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007F"/>
      <stop offset="100%" stop-color="#E91E63"/>
    </linearGradient>
    <linearGradient id="g-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    <linearGradient id="g-deep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0F"/>
      <stop offset="100%" stop-color="#1A1A2E"/>
    </linearGradient>
    <linearGradient id="g-rocket" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF007F"/>
      <stop offset="100%" stop-color="#14F195"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="60" fill="url(#g-deep)" stroke="url(#g-emerald)" stroke-width="2" opacity="0.95"/>

  <!-- Rocket -->
  <g transform="translate(256, 220)" filter="url(#glow)">
    <!-- Body -->
    <path d="M-25 40 L0 -80 L25 40 Z" fill="url(#g-rocket)" opacity="0.9"/>
    <!-- Window -->
    <circle cx="0" cy="-10" r="10" fill="#0A0A0F" stroke="url(#g-emerald)" stroke-width="2"/>
    <!-- Fins -->
    <path d="M-25 30 L-50 60 L-25 45 Z" fill="url(#g-purple)"/>
    <path d="M25 30 L50 60 L25 45 Z" fill="url(#g-purple)"/>
    <!-- Flame -->
    <path d="M-15 45 Q0 90 15 45 Q10 65 0 75 Q-10 65 -15 45 Z" fill="url(#g-gold)" opacity="0.8"/>
    <path d="M-8 45 Q0 70 8 45 Q5 55 0 60 Q-5 55 -8 45 Z" fill="url(#g-magenta)" opacity="0.9"/>
  </g>

  <!-- Stars -->
  <g fill="url(#g-emerald)" opacity="0.7">
    <polygon points="140,120 145,130 155,130 147,137 150,148 140,140 130,148 133,137 125,130 135,130"/>
    <polygon points="360,90 364,98 372,98 366,103 368,112 360,106 352,112 354,103 348,98 356,98" transform="scale(0.8) translate(90, 20)"/>
    <polygon points="380,280 384,288 392,288 386,293 388,302 380,296 372,302 374,293 368,288 376,288" transform="scale(0.6) translate(260, 180)"/>
  </g>
  <circle cx="150" cy="180" r="2" fill="url(#g-gold)" opacity="0.6"/>
  <circle cx="370" cy="160" r="2" fill="url(#g-magenta)" opacity="0.6"/>
  <circle cx="120" cy="300" r="1.5" fill="url(#g-purple)" opacity="0.5"/>
  <circle cx="400" cy="350" r="2" fill="url(#g-gold)" opacity="0.5"/>

  <text x="256" y="410" text-anchor="middle" font-family="'Courier New', monospace" font-size="36" font-weight="bold" fill="url(#g-emerald)">TO THE</text>
  <text x="256" y="452" text-anchor="middle" font-family="'Courier New', monospace" font-size="40" font-weight="bold" fill="url(#g-magenta)">MOON</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#14F195"/>
    </linearGradient>
    <linearGradient id="g-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B59B6"/>
      <stop offset="100%" stop-color="#9945FF"/>
    </linearGradient>
    <linearGradient id="g-magenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007F"/>
      <stop offset="100%" stop-color="#E91E63"/>
    </linearGradient>
    <linearGradient id="g-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    <linearGradient id="g-deep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0F"/>
      <stop offset="100%" stop-color="#1A1A2E"/>
    </linearGradient>
    <linearGradient id="g-furnace" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF007F"/>
      <stop offset="30%" stop-color="#FFA000"/>
      <stop offset="70%" stop-color="#9B59B6"/>
      <stop offset="100%" stop-color="#00E676"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="60" fill="url(#g-deep)" stroke="url(#g-emerald)" stroke-width="2" opacity="0.95"/>

  <!-- Furnace / cauldron -->
  <g transform="translate(256, 230)" filter="url(#glow)">
    <!-- Furnace body -->
    <path d="M-70 -40 L-60 50 L60 50 L70 -40 Z" fill="url(#g-purple)" opacity="0.3" stroke="url(#g-purple)" stroke-width="4" stroke-linejoin="round"/>
    <!-- Opening -->
    <ellipse cx="0" cy="-40" rx="70" ry="15" fill="url(#g-deep)" stroke="url(#g-purple)" stroke-width="3"/>
    <!-- Flames inside -->
    <path d="M-30 -35 Q-10 -60 0 -45 Q10 -65 30 -35" fill="url(#g-gold)" opacity="0.8"/>
    <path d="M-15 -35 Q0 -55 15 -35" fill="url(#g-magenta)" opacity="0.9"/>
    <!-- Molten metal pouring -->
    <path d="M0 -30 L0 40" stroke="url(#g-gold)" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
    <!-- Drops -->
    <circle cx="0" cy="50" r="5" fill="url(#g-gold)" opacity="0.8"/>
    <circle cx="0" cy="65" r="3" fill="url(#g-magenta)" opacity="0.6"/>
  </g>

  <!-- Heat vent lines -->
  <g opacity="0.4">
    <path d="M180 160 Q200 140 190 120" fill="none" stroke="url(#g-gold)" stroke-width="3" stroke-linecap="round"/>
    <path d="M330 160 Q310 140 320 120" fill="none" stroke="url(#g-magenta)" stroke-width="3" stroke-linecap="round"/>
    <path d="M220 140 Q230 120 225 105" fill="none" stroke="url(#g-emerald)" stroke-width="2" stroke-linecap="round"/>
    <path d="M300 140 Q290 120 295 105" fill="none" stroke="url(#g-purple)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <text x="256" y="410" text-anchor="middle" font-family="'Courier New', monospace" font-size="40" font-weight="bold" fill="url(#g-gold)">MELTING</text>
  <text x="256" y="448" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" fill="url(#g-magenta)" opacity="0.8">faces in the furnace</text>
</svg>

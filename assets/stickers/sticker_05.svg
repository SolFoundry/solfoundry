<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#14F195"/>
    </linearGradient>
    <linearGradient id="g-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B59B6"/>
      <stop offset="100%" stop-color="#9945FF"/>
    </linearGradient>
    <linearGradient id="g-magenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007F"/>
      <stop offset="100%" stop-color="#E91E63"/>
    </linearGradient>
    <linearGradient id="g-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    <linearGradient id="g-deep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0F"/>
      <stop offset="100%" stop-color="#1A1A2E"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="60" fill="url(#g-deep)" stroke="url(#g-magenta)" stroke-width="2" opacity="0.95"/>

  <!-- Fire emoji / flame -->
  <g transform="translate(256, 220)" filter="url(#glow)">
    <!-- Outer flame -->
    <path d="M0 -80 Q40 -30 30 20 Q20 60 0 80 Q-20 60 -30 20 Q-40 -30 0 -80 Z" fill="url(#g-gold)" opacity="0.9"/>
    <!-- Inner flame -->
    <path d="M0 -50 Q25 -10 20 20 Q15 50 0 60 Q-15 50 -20 20 Q-25 -10 0 -50 Z" fill="url(#g-magenta)" opacity="0.8"/>
    <!-- Core -->
    <path d="M0 -20 Q12 5 8 25 Q5 40 0 42 Q-5 40 -8 25 Q-12 5 0 -20 Z" fill="#FFF" opacity="0.6"/>
  </g>

  <!-- Sparks / embers -->
  <circle cx="170" cy="160" r="4" fill="url(#g-gold)" opacity="0.8"/>
  <circle cx="340" cy="150" r="3" fill="url(#g-magenta)" opacity="0.7"/>
  <circle cx="160" cy="250" r="2.5" fill="url(#g-gold)" opacity="0.6"/>
  <circle cx="350" cy="280" r="3.5" fill="url(#g-magenta)" opacity="0.7"/>
  <circle cx="200" cy="130" r="2" fill="url(#g-emerald)" opacity="0.5"/>
  <circle cx="320" cy="120" r="2" fill="url(#g-gold)" opacity="0.6"/>

  <text x="256" y="400" text-anchor="middle" font-family="'Courier New', monospace" font-size="44" font-weight="bold" fill="url(#g-magenta)">LIT</text>
  <text x="256" y="442" text-anchor="middle" font-family="'Courier New', monospace" font-size="22" fill="url(#g-gold)" opacity="0.8">absolutely blazing</text>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#14F195"/>
    </linearGradient>
    <linearGradient id="g-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B59B6"/>
      <stop offset="100%" stop-color="#9945FF"/>
    </linearGradient>
    <linearGradient id="g-magenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007F"/>
      <stop offset="100%" stop-color="#E91E63"/>
    </linearGradient>
    <linearGradient id="g-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    <linearGradient id="g-deep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0F"/>
      <stop offset="100%" stop-color="#1A1A2E"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="60" fill="url(#g-deep)" stroke="url(#g-purple)" stroke-width="2" opacity="0.95"/>

  <!-- Shield representing security/trust -->
  <g transform="translate(256, 200)" filter="url(#glow)">
    <path d="M0 -90 L90 -60 L90 20 Q90 70 0 100 Q-90 70 -90 20 L-90 -60 Z" fill="none" stroke="url(#g-emerald)" stroke-width="6" stroke-linejoin="round"/>
    <path d="M0 -70 L70 -45 L70 15 Q70 55 0 80 Q-70 55 -70 15 L-70 -45 Z" fill="url(#g-purple)" opacity="0.2"/>
    <!-- Checkmark -->
    <polyline points="-30,0 -10,25 35,-25" fill="none" stroke="url(#g-emerald)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Audited badge -->
  <g transform="translate(256, 350)">
    <rect x="-65" y="-15" width="130" height="30" rx="15" fill="url(#g-emerald)" opacity="0.9"/>
    <text x="0" y="6" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#0A0A0F">AUDITED ✓</text>
  </g>

  <text x="256" y="430" text-anchor="middle" font-family="'Courier New', monospace" font-size="28" font-weight="bold" fill="url(#g-emerald)">SAFU</text>
</svg>

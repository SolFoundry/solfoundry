<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#14F195"/>
    </linearGradient>
    <linearGradient id="g-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B59B6"/>
      <stop offset="100%" stop-color="#9945FF"/>
    </linearGradient>
    <linearGradient id="g-magenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007F"/>
      <stop offset="100%" stop-color="#E91E63"/>
    </linearGradient>
    <linearGradient id="g-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    <linearGradient id="g-deep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0F"/>
      <stop offset="100%" stop-color="#1A1A2E"/>
    </linearGradient>
    <filter id="glow-green">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded dark background -->
  <rect x="20" y="20" width="472" height="472" rx="60" fill="url(#g-deep)" stroke="url(#g-purple)" stroke-width="2" opacity="0.95"/>

  <!-- Anvil + flame logo central -->
  <g transform="translate(256, 240)" filter="url(#glow-green)">
    <!-- Anvil -->
    <path d="M-80 40 L-50 -20 L50 -20 L80 40 Z" fill="url(#g-emerald)" opacity="0.9"/>
    <rect x="-60" y="-44" width="120" height="28" rx="6" fill="url(#g-purple)"/>
    <path d="M-60 -30 L-100 -36 L-96 -24 L-60 -18 Z" fill="url(#g-emerald)" opacity="0.8"/>
    <!-- Hammer -->
    <g transform="rotate(-25, 0, -80)">
      <rect x="-6" y="-100" width="12" height="48" rx="3" fill="url(#g-emerald)"/>
      <rect x="-22" y="-118" width="44" height="24" rx="6" fill="url(#g-purple)"/>
    </g>
  </g>

  <!-- Flames under anvil -->
  <g opacity="0.7">
    <path d="M220 260 Q230 290 240 280 Q250 300 260 285 Q270 310 280 280 Q290 295 300 260" fill="none" stroke="url(#g-magenta)" stroke-width="4" stroke-linecap="round"/>
    <path d="M200 270 Q215 305 230 290 Q245 320 260 300 Q275 325 290 295 Q305 310 320 270" fill="none" stroke="url(#g-gold)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Sparks flying -->
  <circle cx="170" cy="180" r="5" fill="url(#g-gold)" opacity="0.9"/>
  <circle cx="350" cy="170" r="4" fill="url(#g-emerald)" opacity="0.8"/>
  <circle cx="140" cy="220" r="3" fill="url(#g-magenta)" opacity="0.7"/>
  <circle cx="380" cy="210" r="3" fill="url(#g-gold)" opacity="0.6"/>
  <circle cx="200" cy="150" r="2" fill="url(#g-emerald)" opacity="0.9"/>
  <circle cx="330" cy="145" r="2" fill="url(#g-magenta)" opacity="0.7"/>

  <!-- Text -->
  <text x="256" y="400" text-anchor="middle" font-family="'Courier New', monospace" font-size="42" font-weight="bold" fill="url(#g-emerald)" filter="url(#glow-green)">SolFoundry</text>
  <text x="256" y="440" text-anchor="middle" font-family="'Courier New', monospace" font-size="20" fill="url(#g-purple)" opacity="0.8">FORGE ON</text>
</svg>

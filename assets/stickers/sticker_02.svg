<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#14F195"/>
    </linearGradient>
    <linearGradient id="g-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9B59B6"/>
      <stop offset="100%" stop-color="#9945FF"/>
    </linearGradient>
    <linearGradient id="g-magenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF007F"/>
      <stop offset="100%" stop-color="#E91E63"/>
    </linearGradient>
    <linearGradient id="g-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    <linearGradient id="g-deep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0F"/>
      <stop offset="100%" stop-color="#1A1A2E"/>
    </linearGradient>
    <filter id="glow-purple">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="60" fill="url(#g-deep)" stroke="url(#g-magenta)" stroke-width="2" opacity="0.95"/>

  <!-- Cog/gear as main element -->
  <g transform="translate(256, 245)" filter="url(#glow-purple)">
    <!-- Outer gear teeth -->
    <g fill="url(#g-purple)">
      <rect x="-100" y="-20" width="200" height="40" rx="8"/>
      <rect x="-20" y="-100" width="40" height="200" rx="8"/>
      <g transform="rotate(45)">
        <rect x="-100" y="-20" width="200" height="40" rx="8"/>
        <rect x="-20" y="-100" width="40" height="200" rx="8"/>
      </g>
    </g>
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="60" fill="url(#g-deep)" stroke="url(#g-emerald)" stroke-width="4"/>
    <!-- Inner star -->
    <polygon points="0,-35 10,-10 35,-10 15,8 22,35 0,18 -22,35 -15,8 -35,-10 -10,-10" fill="url(#g-emerald)"/>
  </g>

  <!-- Small orbiting dots -->
  <circle cx="256" cy="110" r="5" fill="url(#g-emerald)" opacity="0.8"/>
  <circle cx="410" cy="245" r="5" fill="url(#g-magenta)" opacity="0.8"/>
  <circle cx="256" cy="380" r="5" fill="url(#g-gold)" opacity="0.8"/>
  <circle cx="102" cy="245" r="5" fill="url(#g-purple)" opacity="0.8"/>

  <text x="256" y="420" text-anchor="middle" font-family="'Courier New', monospace" font-size="44" font-weight="bold" fill="url(#g-emerald)">$FNDRY</text>
  <text x="256" y="455" text-anchor="middle" font-family="'Courier New', monospace" font-size="18" fill="url(#g-purple)" opacity="0.7">forge. your. future.</text>
</svg>

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "bounty-hunter"
version = "1.0.0"
description = "Full Autonomous Bounty-Hunting Agent — SolFoundry"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.scripts]
bounty-hunter = "bounty_hunter.__main__:main"
